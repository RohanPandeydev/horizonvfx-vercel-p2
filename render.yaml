services:
  - type: web
    name: horizonvfx
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build && cp -R public .next/standalone/ && cp -R .next/static .next/standalone/.next/
    startCommand: node .next/standalone/server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

      # --- Database (MySQL) ---
      - key: DATABASE_URL
        sync: false

      # --- Auth / crypto secrets ---
      - key: ENCRYPTION_SECRET
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d

      # --- Public site URL (used for upload URLs, emails) ---
      - key: FRONTEND_URL
        sync: false

      # --- SMTP (optional; contact form + password reset) ---
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

      # --- S3 / R2 storage (required: Render disk is ephemeral) ---
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: S3_PRESIGNED_URL_EXPIRES_IN
        value: "3600"
      - key: S3_PRESIGNED_GET_URL_EXPIRES_IN
        value: "3600"
