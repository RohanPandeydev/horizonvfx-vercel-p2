name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: lc
        run: echo "image=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.lc.outputs.image }}:latest
            ${{ steps.lc.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync deploy config to VPS (Caddyfile, compose.yml — NOT .env)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          SOURCE: deploy/
          TARGET: /srv/horizonvfx/
          EXCLUDE: "/.env.production, /uploads/, /mysql-data/, /caddy-data/, /caddy-config/"
          ARGS: "-rlgoDzvc -i"

      - name: Pull image, restart services, run prisma db push
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DOCKER_TOKEN,DOCKER_USER
          script: |
            set -euo pipefail
            echo "$DOCKER_TOKEN" | docker login ghcr.io -u "$DOCKER_USER" --password-stdin
            cd /srv/horizonvfx
            docker compose pull app
            docker compose up -d --remove-orphans
            # First-deploy-safe schema sync. `db push` is idempotent;
            # `|| true` swallows the first-boot race where db isn't ready yet.
            sleep 5
            docker compose exec -T app sh -c 'cd /app && npx prisma db push --skip-generate' || true
            docker image prune -f
