name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: lc
        run: echo "image=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.lc.outputs.image }}:latest
            ${{ steps.lc.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync deploy config to VPS (Caddyfile, compose.yml — NOT .env)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          host=$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')
          user=$(printf '%s' "$VPS_USER" | tr -d '[:space:]')
          echo "scp target: ${user}@${host}:/srv/horizonvfx/"
          scp -v -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 \
            -i ~/.ssh/deploy_key \
            deploy/docker-compose.yml \
            deploy/Caddyfile \
            "${user}@${host}:/srv/horizonvfx/" 2>&1 | tail -40

      - name: Pull image, restart services, run prisma db push
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DOCKER_TOKEN,DOCKER_USER
          script: |
            set -euo pipefail
            echo "$DOCKER_TOKEN" | docker login ghcr.io -u "$DOCKER_USER" --password-stdin
            cd /srv/horizonvfx
            docker compose pull app
            docker compose up -d --remove-orphans
            # First-deploy-safe schema sync. `db push` is idempotent.
            # Use node directly because Next standalone strips the .bin/ symlinks.
            # --accept-data-loss is needed when schema tweaks (column-type narrowing,
            # adding compound uniques) trigger Prisma's data-loss check even when
            # there's no actual loss for our data.
            sleep 5
            docker compose exec -T app node /app/node_modules/prisma/build/index.js db push --skip-generate --accept-data-loss
            docker image prune -f
